[project]
name = "usernet"
dynamic = ["version"]
description = "A userspace TCP/IP stack and SOCKS5 proxy for tunnels that carry raw IP"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
keywords = ["tcp", "ip", "userspace", "network-stack", "socks5", "vpn", "asyncio", "tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

# Deliberately empty. The stack, the driver, the SOCKS server and the link
# protocol need nothing but the standard library, and that is worth keeping
# true -- it is what lets a consumer treat this as a detail rather than a
# dependency tree. Only the httpx bridge needs anything, and it is an extra.
dependencies = []

[project.urls]
Homepage = "https://github.com/dehesselle/usernet"
Documentation = "https://github.com/dehesselle/usernet/blob/master/docs/MANUAL.md"
Issues = "https://github.com/dehesselle/usernet/issues"
Changelog = "https://github.com/dehesselle/usernet/releases"

[project.optional-dependencies]
httpx = ["httpx>=0.27,<0.29"]
testing = ["trustme>=1.1"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "httpx>=0.27,<0.29",    # exercises usernet.http
    "trustme>=1.1",         # self-signed certs for the TLS endpoint
]

# ---------------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/usernet/version.py"

# ---------------------------------------------------------------------------

[tool.ruff]
# Ruff comes from outside the project, and its defaults change between minor
# releases; bump this once a new minor's findings have been reviewed, together
# with the pin in .github/workflows/build.yml.
required-version = "~=0.16.0"
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "TID"]

# The sans-IO contract: usernet.net must never perform I/O, read a clock, or use
# global randomness. Enforced mechanically here and re-checked at runtime by
# tests/unit/test_sans_io_guard.py, which asserts these modules stay out of
# sys.modules when usernet.net.stack is imported in a clean subprocess.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio".msg = "usernet.net must be sans-IO"
"socket".msg = "usernet.net must be sans-IO"
"ssl".msg = "usernet.net must be sans-IO"
"time".msg = "time is a parameter, not an import"
"random".msg = "inject an rng callable"

[tool.ruff.lint.per-file-ignores]
# The banned-api rule above exists solely to keep src/usernet/net/** sans-IO.
# Ruff cannot express "apply only to this directory", so everywhere else opts
# out. Only src/usernet/net/** is deliberately absent from this list.
"src/usernet/*.py" = ["TID251"]
"src/usernet/runtime/**" = ["TID251"]
"src/usernet/socks/**" = ["TID251"]
"src/usernet/testing/**" = ["TID251"]
"tests/**" = ["TID251"]
"bench/**" = ["TID251"]

# http.py implements httpcore's AsyncNetworkBackend, whose methods take a
# `timeout` argument. The signature is not ours to choose, and renaming it
# would simply break the seam ASYNC109 is trying to protect.
"src/usernet/http.py" = ["TID251", "ASYNC109"]

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The sans-IO core carries the correctness risk and has no untyped third-party
# surface, so it gets the strict treatment.
module = ["usernet.net.*", "usernet.link", "usernet.routing"]
strict = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Non-negotiable: a broken TCP stack hangs forever and would otherwise wedge CI.
timeout = 30
addopts = "--strict-markers"
markers = [
    "slow: takes more than a second",
    "linux_only: requires a Linux tun device or network namespace",
]

[tool.coverage.run]
source = ["usernet"]
branch = true
# CI measures on three operating systems and combines the results, so paths
# are stored relative and mapped back to one tree.
relative_files = true

[tool.coverage.paths]
source = ["src/usernet", "*/src/usernet", '*\src\usernet']

[tool.coverage.report]
# A floor, not a target: it exists so coverage cannot fall without anyone
# noticing. Raise it when coverage rises; never lower it to make a change pass.
fail_under = 88
# Generated by hatch-vcs at install time. The Coverage job reports from a bare
# checkout, where it doesn't exist, and coverage fails on a missing source.
omit = ["*/usernet/version.py"]
