name: Build
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  #-----------------------------------------------------------------------------

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # keep aligned with [tool.ruff] in pyproject.toml
      - name: Check formatting
        run: uvx --from 'ruff~=0.16.0' ruff format --check .

      - name: Lint
        run: uvx --from 'ruff~=0.16.0' ruff check .

      - name: Check REUSE compliance
        run: uvx reuse lint

  #-----------------------------------------------------------------------------

  Test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      # full history for hatch-vcs
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}

      # per OS: mypy narrows sys.platform checks to the host
      - name: Type-check
        run: uv run --locked mypy src

      # Everything except the tun-device conformance suite, which needs a real
      # kernel and runs in the job below.
      - name: Run tests
        run: uv run --locked pytest -q -m "not linux_only" --cov --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.test-${{ matrix.os }}-${{ matrix.python }}

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-test-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true

  #-----------------------------------------------------------------------------

  Conformance:
    # Validates our TCP against a real kernel stack over a tun device. Two
    # instances of our own stack can be consistently wrong together, so this is
    # the only layer that proves conformance rather than self-agreement.
    # The same tests run locally under WSL2.
    #
    # One job per link, so a red one names what broke. A tun device is
    # lossless, so the clean run exercises the happy path and the protocol;
    # each impairment profile exercises a different part of recovery (see
    # impair.sh); kernel-variants changes what the kernel tells us.
    strategy:
      fail-fast: false
      matrix:
        link:
          - clean
          - loss
          - reorder
          - duplicate
          - corrupt
          - bottleneck
          - long-fat
          - kernel-variants
    runs-on: ubuntu-latest
    env:
      LINK: ${{ matrix.link }}
    steps:
      # full history for hatch-vcs
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install project
        run: uv sync --locked

      # Root creates the interface; the tests then run as the ordinary user,
      # because `ip tuntap add ... user` is what makes that possible.
      - name: Create tun device
        run: sudo sh tests/conformance/setup.sh

      - name: Run preflight
        run: uv run --locked python -m tests.conformance.preflight

      # impair.sh degrades *both* directions -- a plain root qdisc is egress
      # only and would leave our own retransmission untested.
      - name: Impair the link
        if: matrix.link != 'clean' && matrix.link != 'kernel-variants'
        run: |
          sudo sh tests/conformance/impair.sh "$LINK"
          echo "USERNET_TUN_NETEM=1" >> "$GITHUB_ENV"

      # Window scaling off, and a route that makes the kernel offer a small
      # MSS. The runner is thrown away afterwards, so global settings are fine.
      - name: Change what the kernel offers
        if: matrix.link == 'kernel-variants'
        run: |
          sudo sysctl -w net.ipv4.tcp_window_scaling=0
          sudo ip route change 10.99.0.0/24 dev usernet0 proto kernel scope link \
            src 10.99.0.1 advmss 536

      # A hop narrower than the tun device, for path-MTU discovery.
      - name: Build a narrow hop
        if: matrix.link == 'clean'
        run: sudo sh tests/conformance/pmtu.sh

      - name: Run tests
        run: uv run --locked pytest tests/conformance -v --cov --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.conformance-${{ matrix.link }}

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-conformance-${{ matrix.link }}
          path: .coverage.*
          include-hidden-files: true

  #-----------------------------------------------------------------------------

  Coverage:
    # Every job's measurements combined, so the conformance runs count too.
    # The floor in pyproject.toml fails this job if coverage falls. It applies
    # here only: each job above measures part of the code, so they pass
    # --cov-fail-under=0.
    runs-on: ubuntu-latest
    needs:
      - Test
      - Conformance
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      # The version pytest-cov uses, from uv.lock. The summary is written
      # whatever the outcome; the last command is the one held to the floor.
      - name: Combine and report
        run: |
          uvx --from coverage==7.15.4 coverage combine
          uvx --from coverage==7.15.4 coverage report --format=markdown --fail-under=0 \
            >> "$GITHUB_STEP_SUMMARY"
          uvx --from coverage==7.15.4 coverage report

  #-----------------------------------------------------------------------------

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build project
        run: uv build --no-sources

      - name: Smoke-test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'EOF'
          import os
          import usernet
          print(usernet.__version__)
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              assert usernet.__version__ == expected, (usernet.__version__, expected)
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  #-----------------------------------------------------------------------------

  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - Lint
      - Test
      - Conformance
      - Coverage
      - Build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --generate-notes

  #-----------------------------------------------------------------------------

  PyPI:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs:
      - Build
      - Release
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/usernet

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
